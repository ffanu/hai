<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Robot mengetik">
  <defs>
    <linearGradient id="botBody" x1="12" y1="10" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EFF6FF"/>
      <stop offset=".52" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#CFFAFE"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes floatBot { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blinkBot { 0%,78%,100% { transform: scaleY(1); } 84%,90% { transform: scaleY(.15); } }
    @keyframes typeDot { 0%,100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-2px); } }
    .bot { animation: floatBot 1.65s ease-in-out infinite; transform-origin: 32px 34px; }
    .eye { animation: blinkBot 2.6s ease-in-out infinite; transform-origin: center; }
    .dot1 { animation: typeDot 1.05s ease-in-out infinite; }
    .dot2 { animation: typeDot 1.05s ease-in-out .16s infinite; }
    .dot3 { animation: typeDot 1.05s ease-in-out .32s infinite; }
    @media (prefers-reduced-motion: reduce) { .bot,.eye,.dot1,.dot2,.dot3 { animation: none; } }
  </style>
  <circle cx="32" cy="32" r="30" fill="#EFF6FF"/>
  <g class="bot" filter="url(#softGlow)">
    <path d="M32 12v8" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
    <circle cx="32" cy="10" r="3.8" fill="#22D3EE"/>
    <rect x="14" y="21" width="36" height="29" rx="12" fill="url(#botBody)" stroke="#2563EB" stroke-opacity=".22" stroke-width="2"/>
    <rect x="18" y="27" width="28" height="14" rx="7" fill="#0F172A"/>
    <circle class="eye" cx="27" cy="34" r="3" fill="#67E8F9"/>
    <circle class="eye" cx="37" cy="34" r="3" fill="#67E8F9"/>
    <rect x="25" y="45" width="14" height="2.8" rx="1.4" fill="#2563EB" opacity=".42"/>
  </g>
  <g fill="#2563EB">
    <circle class="dot1" cx="23" cy="56" r="2.3"/>
    <circle class="dot2" cx="32" cy="56" r="2.3"/>
    <circle class="dot3" cx="41" cy="56" r="2.3"/>
  </g>
</svg>
