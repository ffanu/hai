<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Render gambar">
  <defs>
    <linearGradient id="brush" x1="12" y1="12" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDBA74"/>
      <stop offset=".45" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes brushMove { 0%,100% { transform: rotate(-5deg) translateY(0); } 50% { transform: rotate(5deg) translateY(-2px); } }
    @keyframes sparkle { 0%,100% { opacity: .35; transform: scale(.82); } 50% { opacity: 1; transform: scale(1.14); } }
    @keyframes sweep { 0% { transform: translateX(-26px); opacity: 0; } 25%,75% { opacity: .8; } 100% { transform: translateX(28px); opacity: 0; } }
    .brush { animation: brushMove 1.5s ease-in-out infinite; transform-origin: 34px 34px; }
    .spark1 { animation: sparkle 1.2s ease-in-out infinite; transform-origin: center; }
    .spark2 { animation: sparkle 1.2s ease-in-out .22s infinite; transform-origin: center; }
    .sweep { animation: sweep 1.35s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .brush,.spark1,.spark2,.sweep { animation: none; } }
  </style>
  <rect x="6" y="8" width="52" height="48" rx="16" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>
  <path class="sweep" d="M18 20h26" stroke="#FDBA74" stroke-width="4" stroke-linecap="round" opacity=".65"/>
  <g class="brush">
    <path d="M22 42c5-1 9-4 12-9l15-21c1.2-1.8 3.9-.2 2.9 1.7L40 37c-2.2 4.3-6 7.3-10.7 8.5L22 47v-5z" fill="url(#brush)"/>
    <path d="M20 42c-4 2-6 5-7 9 5-.4 8.5-1.8 11-5l-4-4z" fill="#0F172A"/>
  </g>
  <path class="spark1" d="M20 17l1.8 3.6 4 .6-2.9 2.8.7 4-3.6-1.9-3.6 1.9.7-4-2.9-2.8 4-.6L20 17z" fill="#2563EB"/>
  <path class="spark2" d="M48 39l1.2 2.5 2.8.4-2 2 .5 2.8-2.5-1.3-2.5 1.3.5-2.8-2-2 2.8-.4L48 39z" fill="#FB923C"/>
</svg>
